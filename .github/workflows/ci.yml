name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish, since they release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs (version in the comment); Dependabot keeps both current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm and Node versions come from package.json (packageManager, devEngines.runtime), so CI can't drift.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Known advisories, read from the npm registry. GitHub's Dependabot alerts can't read pnpm 12's lockfile.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      # example:template-only
      # Keeps every example's lines between its markers, so an example can be removed cleanly.
      - name: Check examples
        run: node scripts/check-examples.mjs
      # /example:template-only

      # Unused files, exports and dependencies, and dependencies used but not declared (knip).
      - name: Unused code
        run: pnpm check:unused

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Packs each package the way it would publish, then checks its layout (publint) and type resolution (attw).
      - name: Package checks
        run: pnpm check:packages

      # example:web
      - name: Size budget
        run: pnpm size

      # Cache Playwright's browser per Playwright version, so CI downloads it once, not every run.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @monorepo/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Headless tests only need Chromium's headless shell; the runner image already has its system libraries.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @monorepo/web exec playwright install --only-shell chromium

      - name: Browser tests
        run: pnpm test:browser
      # /example:web

  # Runs the unit tests on every Node.js major the packages support (engines.node), on Linux, macOS and Windows.
  compat:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # pnpm runs scripts on the pinned Node (devEngines.runtime), so call Vitest with this job's Node directly.
      - name: Test
        run: |
          node --version
          node node_modules/vitest/vitest.mjs run

  # Audits the workflows themselves (zizmor): injection, excessive permissions, unsafe triggers, unpinned actions.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Raised by hand (Dependabot can't), to a zizmor release at least 3 days old.
      ZIZMOR_VERSION: 1.31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without Advanced Security, findings fail the job, and private copies of the template work the same way.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          version: ${{ env.ZIZMOR_VERSION }}

  # Publishes each commit as installable preview packages (pkg.pr.new) and comments the install commands on the PR.
  # Off until the repository variable PKG_PR_NEW is 'true'; pull requests from forks never run it.
  preview:
    needs: build
    if: vars.PKG_PR_NEW == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The pkg.pr.new GitHub App authenticates this run, with no token, so zizmor's trusted-publishing advice doesn't apply.
      - name: Publish previews
        run: pnpm exec pkg-pr-new publish --pnpm './packages/*' # zizmor: ignore[use-trusted-publishing]

  # Releases only on pushes to main, after every check passes. Pull requests, including forks, never reach it.
  # The trusted publisher on npmjs.com names this file (ci.yml): npm checks the calling workflow.
  release:
    needs: [build, compat, workflows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # version PR branch, git tags, GitHub releases
      pull-requests: write # the version PR
      id-token: write # npm trusted publishing (OIDC); release.yml grants it only to the publish job
    # A job-level ./ reference is read from this commit, not from files a step wrote, so $/ adds nothing here.
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
