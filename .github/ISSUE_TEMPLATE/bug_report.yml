name: Bug report
description: Something doesn't work as documented.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Security problems go through private reporting instead (see SECURITY.md).
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: 'your-package 0.1.0'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest code or commands that show the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: 'Node.js 24.12.0, macOS 15'
    validations:
      required: true
